aid: ratio-therapeutics
name: Ratio Therapeutics
description: >-
  Ratio Therapeutics Inc. is a clinical-stage pharmaceutical company headquartered at One Design Center
  Place in Boston, Massachusetts, developing next-generation precision radiopharmaceuticals for solid
  tumors. Founded in 2022 by Jack Hoppin, Ph.D. and John Babich, Ph.D., the company pairs two proprietary
  R&D platforms — Trillium, a tunable albumin-binding targeting scaffold that modulates pharmacokinetics,
  and Macropa, a bifunctional chelator built for the alpha emitter actinium-225 — to improve drug
  availability, tumor delivery and tumor loading. Its lead program, [Ac-225]RTX-2358, is a FAP-targeted
  radiotherapeutic in the ATLAS Phase 1/2 trial, alongside a next-generation GRPR program, mono- and
  bispecific radioligand therapies, and PET imaging assets. Ratio has licensing and collaboration
  agreements with Novartis, Merck, Bayer and Lantheus, isotope supply agreements with Nusano, TerraPower
  Isotopes and PanTera, and manufacturing partnerships with PharmaLogic and Eckert & Ziegler. It closed a
  $70 million Series C in July 2026, bringing total capital raised past $240 million. Ratio is a
  therapeutics developer rather than a software vendor: it publishes no developer program, no public API
  and no machine-readable API contract.
